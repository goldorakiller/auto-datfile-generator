name: Daily rebuild

on:
  push:
    branches:
      - 'master'
  schedule:
    # 23h50 heure de Paris (cron GitHub Actions en UTC) — decale d'1h l'hiver
    # (fin de l'heure d'ete), a rajuster alors si l'horaire pile doit tenir.
    - cron:  '50 21 * * *'
  workflow_dispatch:

# Un seul run a la fois : plusieurs push rapproches declenchaient des runs
# qui se chevauchaient et se percutaient au moment de "git push" en fin de
# job (constate en reel aout 2026). "cancel-in-progress: false" les met en
# file plutot que d'en annuler un — chacun doit quand meme aboutir a une
# release.
concurrency:
  group: daily-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pipenv'

      - name: Setup base environment
        run: |
          echo "timestamp=$(date +%s)" >> $GITHUB_ENV

      - name: Install pipenv
        run: curl https://raw.githubusercontent.com/pypa/pipenv/master/get-pipenv.py | python
      - name: Setup pipenv environment
        run: pipenv install --deploy

      - name: Download dats and generate profile.xml for Redump
        id: redump
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 redump.py

      - name: Download dats and generate profile.xml for No-Intro
        id: nointro
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 no-intro.py

      - name: Download dats and generate profile.xml for TOSEC
        id: tosec
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 tosec.py

      - name: Pin ftp2.grandis.nu address from public DNS (WHDLoad)
        # Le resolveur DNS des runners (Azure) echoue souvent sur ce nom
        # ("Temporary failure in name resolution", 8 runs sur 15 en sept. 2026,
        # 4 nouvelles tentatives sur 2 min n'y changent rien) alors que Cloudflare,
        # Google, Quad9 et les serveurs de dnsmaster.io repondent. L'adresse est
        # donc demandee a 1.1.1.1 puis 8.8.8.8 et inscrite dans /etc/hosts pour ce
        # run : whdload.py garde le nom (certificat HTTPS verifie normalement).
        # Toujours epinglee, meme si le resolveur local repond a cet instant : ses
        # echecs sont intermittents. Aucune reponse : rien n'est ecrit, WHDLoad
        # echoue comme avant et le bilan final le signale.
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: |
          host=ftp2.grandis.nu
          for server in 1.1.1.1 8.8.8.8; do
            ip=$(dig +short +time=5 +tries=2 "@$server" "$host" A | grep -E '^[0-9]+(\.[0-9]+){3}$' | tail -n1 || true)
            if [ -n "$ip" ]; then
              echo "$ip $host" | sudo tee -a /etc/hosts
              echo "$host -> $ip (resolved through $server, pinned in /etc/hosts)"
              exit 0
            fi
          done
          echo "::warning::$host could not be resolved through public DNS either"

      - name: Download dat for WHDLoad (Retroplay packs, root zips only)
        id: whdload
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 whdload.py

      - name: Download dats for Pleasuredome MAME (full sets)
        id: pd_mame
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 pleasuredome-mame.py

      - name: Download dats for Pleasuredome HBMAME (full sets)
        id: pd_hbmame
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 pleasuredome-hbmame.py

      - name: Download dats for Pleasuredome Pinball (Visual + Future)
        id: pd_pinball
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 pleasuredome-pinball.py

      - name: Download dats for FBNeo
        id: fbneo
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 fbneo.py

      - name: Download dats for Eggmansworld/Datfiles (all collections)
        id: eggman
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 eggmansworld-datfiles.py

      - name: Download dats for Libretro-database (dat folder)
        id: libretro_dat
        if: ${{ ! cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pipenv run python3 libretro-database-dat.py

      - name: "Download dats for Libretro-database (metadat folder: mame-split, mame, no-intro, redump, tosec)"
        id: libretro_metadat
        if: ${{ ! cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pipenv run python3 libretro-database-metadat.py

      - name: Download dats for Pleasuredome PinMAME
        id: pd_pinmame
        if: ${{ ! cancelled() }}
        continue-on-error: true
        run: pipenv run python3 pleasuredome-pinmame.py

      - name: Build arcade subsets by board (FBNeo + MAME, from the dats above)
        # Apres fbneo.py et pleasuredome-mame.py (ses deux sources) et avant le
        # rafraichissement de retrobat-systems.json (qui doit voir les versions
        # du jour). Si une source n'a pas pu etre telechargee aujourd'hui, la
        # copie de la veille du depot sert de source.
        if: ${{ ! cancelled() }}
        run: pipenv run python3 arcade-subsets.py

      - name: Build Eggmansworld subsets (games only, e.g. LaserActive discs)
        # Apres eggmansworld-datfiles.py (sa source) et avant le rafraichissement
        # de retrobat-systems.json. Comme pour arcade-subsets.py, la copie de la
        # veille du depot sert de source si le telechargement du jour a echoue.
        if: ${{ ! cancelled() }}
        run: pipenv run python3 eggmansworld-subsets.py

      - name: Download TeknoParrot Collection and build its subsets (e.g. Namco 357/369)
        # Depot separe Eggmansworld/TeknoParrot : le zip (~145 Mo, dat ~620 Mo) est
        # telecharge puis filtre, jamais commite. Namco 357/369 est commite dans
        # teknoparrot-subsets/ ; le dat RetroBat complet (TeknoParrot-RetroBat.datz,
        # ~150 Mo) part en piece jointe de la release (etape "Create release").
        # Source externe : meme traitement que les autres (copie de la veille
        # gardee si echec, signalee dans le bilan).
        id: teknoparrot
        if: ${{ ! cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pipenv run python3 teknoparrot-subsets.py

      - name: Refresh retrobat-systems.json (Version/Url/File only, curated assignments untouched)
        if: ${{ ! cancelled() }}
        run: pipenv run python3 retrobat-systems.py

        # HTGD disabled for now
        #- name: Download dats and generate profile.xml for HTGD
        #  if: ${{ ! cancelled() }}
        #  run: pipenv run python3 smdb.py
        
        # dats.site disabled for now
        #- name: Download dats and generate profile.xml for dats.site
        #  if: ${{ ! cancelled() }}
        #  run: pipenv run python3 dats-site.py

      - name: Commit and push individual dat files
        # Publie chaque dat individuel (un sous-dossier par fournisseur) dans
        # le repo, pour que chaque manifeste puisse pointer dessus directement
        # via raw.githubusercontent.com — le client (RBTools) n'a plus besoin
        # de telecharger un zip complet pour en extraire un seul fichier.
        # "git add -A" + .gitignore (regle generique !*/*.dat, !*/*.xml)
        # plutot qu'une liste de dossiers en dur : suit automatiquement une
        # nouvelle source ajoutee sans repasser par ce fichier.
        # GITHUB_TOKEN ne redeclenche pas ce workflow (push sur "on: push") :
        # pas de risque de boucle infinie. rebase avant push : plusieurs runs
        # peuvent se chevaucher si plusieurs commits arrivent coup sur coup.
        if: ${{ ! cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update individual dat files"
          git fetch origin master
          git rebase origin/master || git rebase --abort
          git push

      - name: Create release
        if: ${{ ! cancelled() }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          # *.datz : dats trop gros pour git (TeknoParrot-RetroBat.datz), publies
          # seulement ici. Si teknoparrot-subsets.py a echoue, aucun .datz sur
          # disque : la piece jointe de la veille reste sur la release.
          artifacts: "*.xml,*.zip,*.json,*.datz"
          commit: master
          name: Daily_Rebuild
          makeLatest: true
          tag: Daily_Rebuild
          token: ${{ secrets.GITHUB_TOKEN }}
          body: "Automatically released by github actions"

      - name: Report sources that could not be refreshed
        # Les etapes de sources externes ont continue-on-error : une source
        # injoignable (WHDLoad, 8 echecs sur 15 runs en sept. 2026) ne fait plus
        # echouer tout le run, sa copie de la veille reste en place
        # (dat_output_dir.replace_directory). Ce bilan les liste en avertissement
        # et dans le resume du run pour qu'aucune panne ne passe inapercue.
        if: ${{ always() }}
        run: |
          failed=""
          if [ "${{ steps.redump.outcome }}" = "failure" ]; then failed="$failed|Redump"; fi
          if [ "${{ steps.nointro.outcome }}" = "failure" ]; then failed="$failed|No-Intro"; fi
          if [ "${{ steps.tosec.outcome }}" = "failure" ]; then failed="$failed|TOSEC"; fi
          if [ "${{ steps.whdload.outcome }}" = "failure" ]; then failed="$failed|WHDLoad"; fi
          if [ "${{ steps.pd_mame.outcome }}" = "failure" ]; then failed="$failed|Pleasuredome MAME"; fi
          if [ "${{ steps.pd_hbmame.outcome }}" = "failure" ]; then failed="$failed|Pleasuredome HBMAME"; fi
          if [ "${{ steps.pd_pinball.outcome }}" = "failure" ]; then failed="$failed|Pleasuredome Pinball"; fi
          if [ "${{ steps.fbneo.outcome }}" = "failure" ]; then failed="$failed|FBNeo"; fi
          if [ "${{ steps.eggman.outcome }}" = "failure" ]; then failed="$failed|Eggmansworld"; fi
          if [ "${{ steps.teknoparrot.outcome }}" = "failure" ]; then failed="$failed|TeknoParrot Collection"; fi
          if [ "${{ steps.libretro_dat.outcome }}" = "failure" ]; then failed="$failed|Libretro-database (dat)"; fi
          if [ "${{ steps.libretro_metadat.outcome }}" = "failure" ]; then failed="$failed|Libretro-database (metadat)"; fi
          if [ "${{ steps.pd_pinmame.outcome }}" = "failure" ]; then failed="$failed|Pleasuredome PinMAME"; fi
          if [ -z "$failed" ]; then
            echo "All sources refreshed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Sources NOT refreshed (yesterday's copy kept)" >> "$GITHUB_STEP_SUMMARY"
          IFS='|'
          for name in ${failed#|}; do
            echo "::warning::$name could not be refreshed, yesterday's copy was kept"
            echo "- $name" >> "$GITHUB_STEP_SUMMARY"
          done
